<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ravine Sanctuary</title>
<style>
  :root { --ink: #e9dfc4; --dim: #a59a80; --panel: rgba(16, 18, 20, 0.78); --gold: #d8b660; }
  html, body { margin: 0; height: 100%; background: #0d1210; overflow: hidden; color: var(--ink);
    font: 13px/1.45 "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 16px; top: 14px; pointer-events: none; display: flex; gap: 4px; }
  .heart { width: 18px; height: 16px; image-rendering: pixelated; }
  #msg { position: fixed; left: 50%; bottom: 9%; transform: translateX(-50%); padding: 10px 20px;
    background: var(--panel); border: 1px solid #5c513c; border-radius: 3px; letter-spacing: .03em;
    opacity: 0; transition: opacity .6s; pointer-events: none; text-align: center; max-width: 80vw; }
  #msg.on { opacity: 1; }
  #help { position: fixed; right: 14px; bottom: 12px; color: var(--dim); text-align: right; font-size: 12px;
    background: rgba(10,12,12,.55); padding: 6px 10px; border-radius: 3px; pointer-events: none; }
  #help b { color: var(--ink); font-weight: normal; }
  #debug { position: fixed; right: 14px; top: 12px; width: 250px; background: var(--panel); padding: 10px 12px;
    border: 1px solid #3c3a33; border-radius: 3px; display: none; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
  #debug.on { display: block; }
  #debug label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 3px 0; }
  #debug input[type=range] { width: 120px; }
  #debug h3 { margin: 0 0 6px; font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--gold); }
  #debug .row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  #debug button { font: 11px ui-monospace, Menlo, Consolas, monospace; background: #2a2b28; color: var(--ink); border: 1px solid #555; border-radius: 2px; padding: 2px 6px; cursor: pointer; }
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(10,14,12,.55), rgba(8,10,9,.9)); transition: opacity 1s; z-index: 5; }
  #title.gone { opacity: 0; pointer-events: none; }
  #title h1 { font-weight: normal; letter-spacing: .18em; font-size: 28px; margin: 0 0 6px; color: var(--ink); }
  #title p { color: var(--dim); margin: 2px; }
  #title .go { margin-top: 18px; color: var(--gold); letter-spacing: .1em; }
  #hud { align-items: center; }
  .suns { display: inline-flex; gap: 4px; margin-left: 10px; }
  .suns i { width: 9px; height: 9px; transform: rotate(45deg); border: 1px solid #8a7444; background: rgba(20,20,18,.6); }
  .suns i.on { background: var(--gold); border-color: #f0d890; box-shadow: 0 0 4px rgba(216,182,96,.6); }
  #banner { position: fixed; left: 50%; top: 13%; transform: translateX(-50%); letter-spacing: .32em; font-size: 20px;
    color: var(--ink); text-shadow: 0 1px 3px #000; opacity: 0; transition: opacity 1s; pointer-events: none; white-space: nowrap; }
  #banner.on { opacity: .92; }
  #prompt { position: fixed; left: 50%; bottom: 20%; transform: translateX(-50%); font-size: 12px; color: var(--gold);
    background: rgba(10,12,12,.6); padding: 3px 10px; border-radius: 2px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #prompt.on { opacity: 1; }
  #bossbar { position: fixed; left: 50%; bottom: 5%; transform: translateX(-50%); width: 44vw; max-width: 520px; text-align: center;
    opacity: 0; transition: opacity .8s; pointer-events: none; letter-spacing: .2em; font-size: 12px; color: var(--dim); }
  #bossbar.on { opacity: 1; }
  #bossbar .bar { height: 6px; margin-top: 4px; background: rgba(10,10,10,.7); border: 1px solid #5c513c; }
  #bossfill { height: 100%; width: 100%; background: linear-gradient(#c49a4a, #8a5a2a); transition: width .2s; }
  #fade { position: fixed; inset: 0; background: #070908; opacity: 0; transition: opacity .7s; pointer-events: none; z-index: 4; }
  #fade.on { opacity: 1; }
  #endcard { position: fixed; left: 50%; bottom: 7%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity 2s;
    pointer-events: none; z-index: 6; background: rgba(8,10,9,.7); padding: 20px 34px; border: 1px solid #5c513c; }
  #endcard.on { opacity: 1; }
  #endcard h2 { font-weight: normal; letter-spacing: .14em; margin: 0 0 8px; }
  #endcard p { color: var(--dim); margin: 3px; }
  #debug h4 { margin: 8px 0 2px; font: 11px ui-monospace, Menlo, Consolas, monospace; color: var(--dim); }
</style>
</head>
<body>
<div id="hud"></div>
<div id="banner"></div>
<div id="msg"></div>
<div id="prompt">E · interact</div>
<div id="bossbar">THE WARDEN OF THE DEEP<div class="bar"><div id="bossfill"></div></div></div>
<div id="fade"></div>
<div id="endcard"></div>
<div id="help"><b>WASD / arrows</b> move · <b>Space</b> jump · <b>J / Z</b> attack · <b>K / X / Shift</b> dash · <b>E</b> interact · <b>F1</b> debug · <b>M</b> mute</div>
<div id="debug">
  <h3>camera / render debug</h3>
  <label>pitch <input id="dbPitch" type="range" min="25" max="70" step="1"><span id="dbPitchV"></span></label>
  <label>zoom (view h) <input id="dbZoom" type="range" min="8" max="30" step="0.5"><span id="dbZoomV"></span></label>
  <label>fov <input id="dbFov" type="range" min="6" max="55" step="1"><span id="dbFovV"></span></label>
  <label>sun azimuth <input id="dbSunAz" type="range" min="0" max="360" step="5"><span id="dbSunAzV"></span></label>
  <label>sun height <input id="dbSunEl" type="range" min="15" max="85" step="1"><span id="dbSunElV"></span></label>
  <h4>toggles</h4>
  <label>lighting <input id="dbLighting" type="checkbox"></label>
  <label>shadow maps <input id="dbShadows" type="checkbox"></label>
  <label>depth tint / haze <input id="dbDepth" type="checkbox"></label>
  <label>sprite light response <input id="dbSpriteLight" type="checkbox"></label>
  <label>foreground canopy <input id="dbCanopy" type="checkbox"></label>
  <label>occluder reveal <input id="dbReveal" type="checkbox"></label>
  <label>contact shadows <input id="dbBlob" type="checkbox"></label>
  <label>sprite cast shadows <input id="dbSpriteShadows" type="checkbox"></label>
  <div class="row">
    <button data-preset="0">42° default</button><button data-preset="1">35° low</button>
    <button data-preset="2">55° high</button><button data-preset="3">near-ortho</button>
  </div>
  <div class="row"><button id="dbShot">save screenshot</button></div>
</div>
<div id="title">
  <h1>RAVINE SANCTUARY</h1>
  <p>an Alundra-lineage traversal and lighting prototype</p>
  <p class="go" id="go">loading…</p>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
